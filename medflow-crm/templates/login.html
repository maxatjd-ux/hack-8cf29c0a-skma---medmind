
<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — MedFlow</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tokens.css"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:Manrope,sans-serif;color:var(--ink)}.card{width:min(410px,calc(100% - 30px));background:var(--white);padding:34px;border-radius:20px;box-shadow:var(--shadow)}.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px;margin-bottom:28px}.logo span{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--green2);color:var(--green)}h1{font-size:25px;margin:0 0 6px}p{font-size:12px;color:var(--muted);margin:0 0 24px}label{display:grid;gap:7px;font-size:11px;font-weight:700;margin-top:15px}input{border:1px solid var(--line);border-radius:10px;padding:12px;font:500 13px Manrope}button{width:100%;margin-top:22px;border:0;border-radius:10px;padding:13px;background:var(--green);color:var(--white);font:700 13px Manrope;cursor:pointer}.error{background:var(--green2);color:var(--orange);padding:10px;border-radius:8px;font-size:11px}</style></head><body><main class="card"><div class="logo"><span>M</span>MedFlow</div><h1>Вход администратора</h1><p>Управление пациентами и процедурами</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><label>Логин<input name="username" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Войти</button></form></main></body></html>
